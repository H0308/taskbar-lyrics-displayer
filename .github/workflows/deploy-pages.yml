name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
    # 发布站点和选定的产品介绍成片；视频制作工程不属于 Pages 输入。
    paths:
      - 'site/**'
      - 'asset/taskbar-lyrics-promo.mp4'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare product introduction video
        run: |
          mkdir -p site/assets/media
          cp asset/taskbar-lyrics-promo.mp4 site/assets/media/taskbar-lyrics-promo.mp4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
