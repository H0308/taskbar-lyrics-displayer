name: 问题反馈
description: 反馈使用任务栏歌词时遇到的问题。
title: "[问题] "
body:
  - type: textarea
    id: summary
    attributes:
      label: 遇到了什么问题？
      placeholder: 例如，我在 QQ 音乐里暂停了歌曲，任务栏歌词还在继续滚动。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 补充信息（选填）
      description: 可以贴截图，或写下你记得的操作、软件版本等线索。上传截图或日志前请遮挡个人信息。
