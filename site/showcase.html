  <main id="top">
    <!-- 实际软件截图与按需播放的录屏；发布素材独立于视频制作工程。 -->
    <section class="showcase" id="showcase" aria-labelledby="showcaseTitle">
      <div class="container">
        <div class="showcase-heading">
          <h1 id="showcaseTitle">软件截图与动态示例</h1>
          <p>从任务栏的一句歌词，到顺手展开的控制卡片，看看软件的实际界面与操作。</p>
        </div>

        <div class="showcase-subheading">
          <h2>软件截图</h2>
          <span>选择场景，点击图片放大</span>
        </div>
        <div class="showcase-options" role="group" aria-label="选择软件截图">
          <button type="button" aria-pressed="true" data-screen="desktop.png" data-detail="taskbar.png" data-title="日常桌面" data-description="QQ 音乐窗口是正在使用的播放器，底部任务栏中的封面、歌词与频谱才是任务栏歌词。">日常桌面</button>
          <button type="button" aria-pressed="false" data-screen="immersive.png" data-title="沉浸模式" data-description="歌词与控制区域融入任务栏，让桌面保持完整。">沉浸模式</button>
          <button type="button" aria-pressed="false" data-screen="dock-top.png" data-title="顶部 Dock" data-description="在屏幕顶部独立放置歌词、频谱与资源监视。">顶部 Dock</button>
          <button type="button" aria-pressed="false" data-screen="dock-bottom.png" data-title="底部 Dock" data-description="把独立的音乐工作区放在屏幕底部。">底部 Dock</button>
          <button type="button" aria-pressed="false" data-screen="media-card.png" data-title="媒体卡片" data-description="展开卡片查看封面、进度与播放控制，还有伴听宠物陪伴。">媒体卡片</button>
          <button type="button" aria-pressed="false" data-screen="idle.png" data-title="每日一言与今日任务" data-description="没有播放音乐时，展开每日一言与滴答清单今日任务。">空闲卡片</button>
          <button type="button" aria-pressed="false" data-screen="settings-display.png" data-title="显示设置" data-description="分别设置任务栏与悬浮窗口的主题，选择字体和封面样式。">显示设置</button>
          <button type="button" aria-pressed="false" data-screen="settings-spectrum.png" data-title="频谱设置" data-description="选择频谱样式、颜色与特效，搭配自己的桌面。">频谱设置</button>
          <button type="button" aria-pressed="false" data-screen="settings-lyrics.png" data-title="歌词设置" data-description="调整双行歌词、辅助歌词与逐字特效。">歌词设置</button>
        </div>
        <figure class="showcase-gallery">
          <a class="showcase-screen" id="screenshotLink" href="assets/media/desktop.png" target="_blank" rel="noopener" aria-label="放大查看日常桌面截图">

          </div>
          <figcaption class="showcase-caption" aria-live="polite" aria-atomic="true">
            <strong id="screenshotTitle">日常桌面</strong>

          </figcaption>
        </figure>

        <div class="showcase-subheading showcase-demo-heading">

        </div>
        <div class="showcase-options" role="group" aria-label="选择功能录屏">
          <button type="button" data-demo="lyrics" aria-pressed="true">逐字与双行歌词</button>
          <button type="button" data-demo="translation" aria-pressed="false">翻译</button>
          <button type="button" data-demo="romanization" aria-pressed="false">罗马音</button>

          <button type="button" data-demo="underline" aria-pressed="false">笔触下划线</button>

          <button type="button" data-demo="search" aria-pressed="false">手动搜索</button>
          <button type="button" data-demo="positioning" aria-pressed="false">拖动与避让</button>
          <button type="button" data-demo="immersive" aria-pressed="false">沉浸模式交互</button>
        </div>
        <figure class="showcase-player">
          <div class="showcase-video-stage">
            <video id="demoVideo" muted playsinline preload="metadata" src="assets/media/lyrics.mp4" aria-label="逐字与双行歌词功能录屏" aria-describedby="demoDescription"></video>
          </div>
          <div class="showcase-controls">
            <button type="button" id="demoPlay" aria-controls="demoVideo" aria-label="播放示例" title="播放示例" data-state="paused">
              <svg class="demo-icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 5.5a1 1 0 0 1 1.5-.86l9 5.5a1 1 0 0 1 0 1.72l-9 5.5A1 1 0 0 1 9 16.5z"/></svg>
              <svg class="demo-icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
              <svg class="demo-icon-replay" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 6M4 4v6h6"/></svg>
            </button>
            <label class="sr-only" for="demoProgress">录屏播放进度</label>
            <input id="demoProgress" type="range" min="0" max="100" step="0.1" value="0" disabled aria-valuetext="尚未播放">
            <span id="demoTime">0:00</span>
          </div>
          <figcaption class="showcase-caption">
            <strong id="demoTitle">逐字与双行歌词</strong>
            <p id="demoDescription">看唱词逐字亮起，长句自然滚动，下一句提前出现在熟悉的位置。</p>
          </figcaption>
          <p class="showcase-status" id="demoStatus" role="status"></p>
        </figure>
        <p class="showcase-note">截图与录屏效果仅供参考，请以实际产品效果为准。字体、颜色与特效可在设置中调整。</p>
